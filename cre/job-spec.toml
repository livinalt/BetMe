# CRE Job Spec — ETH/USD Prediction Market Settlement
# Network: Base Sepolia (Chain ID: 84532)
# Trigger: Cron every 5 minutes
# Sources: Binance, CoinGecko, Gate.io (all verified reachable)
# Aggregation: Median — resistant to single-source manipulation

name = "eth-usd-prediction-market-settlement"
schemaVersion = 1

[trigger]
type     = "cron"
schedule = "*/5 * * * *"

[[tasks]]
name     = "check_expiry"
type     = "blockchain_read"
chain    = "base-sepolia"
contract = "${PM_ADDRESS}"
abi      = "markets(uint256)((uint256,uint256,uint256,uint256,uint256,uint8))"
args     = ["${MARKET_ID}"]
# Exits early if state == 1 (SETTLED) or block.timestamp < expiry

[[tasks]]
name       = "fetch_binance"
type       = "http"
url        = "https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT"
method     = "GET"
jsonPath   = "$.price"
resultType = "decimal"
dependsOn  = ["check_expiry"]

[[tasks]]
name       = "fetch_coingecko"
type       = "http"
url        = "https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd"
method     = "GET"
jsonPath   = "$.ethereum.usd"
resultType = "decimal"
dependsOn  = ["check_expiry"]

[[tasks]]
name       = "fetch_gateio"
type       = "http"
url        = "https://api.gateio.ws/api/v4/spot/tickers?currency_pair=ETH_USDT"
method     = "GET"
jsonPath   = "$[0].last"
resultType = "decimal"
dependsOn  = ["check_expiry"]

[[tasks]]
name      = "compute_median"
type      = "median"
inputs    = ["fetch_binance", "fetch_coingecko", "fetch_gateio"]
multiply  = 100000000
dependsOn = ["fetch_binance", "fetch_coingecko", "fetch_gateio"]

[[tasks]]
name      = "submit_settlement"
type      = "eth_tx"
chain     = "base-sepolia"
contract  = "${SE_ADDRESS}"
abi       = "executeSettlement(uint256,uint256)"
args      = ["${MARKET_ID}", "compute_median.result"]
gasLimit  = 200000
dependsOn = ["compute_median"]
