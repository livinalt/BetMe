# CRE Job Spec — Event Market Settlement
# Event: Will ETH 24h Binance volume exceed $1B USD?
# Resolution: majority vote across 3 independent data checks
# Network: Base Sepolia

name = "eth-volume-event-market-settlement"
schemaVersion = 1

[trigger]
type     = "cron"
schedule = "*/5 * * * *"

# ── Check market ready ───────────────────────────────────────────────
[[tasks]]
name     = "check_expiry"
type     = "blockchain_read"
chain    = "base-sepolia"
contract = "${EM_ADDRESS}"
abi      = "markets(uint256)((bytes32,string,uint256,uint256,uint256,uint8))"
args     = ["${EVENT_MARKET_ID}"]
# Exits if outcome != 0 (UNRESOLVED) or block.timestamp < expiry

# ── Fetch volume from 3 independent sources ──────────────────────────
# Each returns 24h ETH/USDT quote volume
# Threshold: $1,000,000,000 (1 billion USD)

[[tasks]]
name       = "fetch_binance_volume"
type       = "http"
url        = "https://api.binance.com/api/v3/ticker/24hr?symbol=ETHUSDT"
method     = "GET"
jsonPath   = "$.quoteVolume"
resultType = "decimal"
dependsOn  = ["check_expiry"]

[[tasks]]
name       = "fetch_coingecko_volume"
type       = "http"
url        = "https://api.coingecko.com/api/v3/coins/ethereum/market_chart?vs_currency=usd&days=1"
method     = "GET"
jsonPath   = "$.total_volumes[-1][1]"
resultType = "decimal"
dependsOn  = ["check_expiry"]

[[tasks]]
name       = "fetch_gateio_volume"
type       = "http"
url        = "https://api.gateio.ws/api/v4/spot/tickers?currency_pair=ETH_USDT"
method     = "GET"
jsonPath   = "$[0].quote_volume"
resultType = "decimal"
dependsOn  = ["check_expiry"]

# ── Evaluate each source against threshold ───────────────────────────
# Each compare task returns 1 (YES) or 0 (NO)
# Threshold: 1000000000 (1 billion)

[[tasks]]
name       = "eval_binance"
type       = "compare"
input      = "fetch_binance_volume"
operator   = ">="
threshold  = 1000000000
dependsOn  = ["fetch_binance_volume"]

[[tasks]]
name       = "eval_coingecko"
type       = "compare"
input      = "fetch_coingecko_volume"
operator   = ">="
threshold  = 1000000000
dependsOn  = ["fetch_coingecko_volume"]

[[tasks]]
name       = "eval_gateio"
type       = "compare"
input      = "fetch_gateio_volume"
operator   = ">="
threshold  = 1000000000
dependsOn  = ["fetch_gateio_volume"]

# ── Majority vote ────────────────────────────────────────────────────
# Sums YES votes (0 or 1 each), max=3
# >= 2 → outcome=YES (1)
#  < 2 → outcome=NO  (2)
# If any fetch failed → outcome=INVALID (3)

[[tasks]]
name      = "majority_vote"
type      = "sum"
inputs    = ["eval_binance", "eval_coingecko", "eval_gateio"]
dependsOn = ["eval_binance", "eval_coingecko", "eval_gateio"]
# result: 0, 1, 2, or 3 yes-votes

[[tasks]]
name      = "map_outcome"
type      = "conditional"
input     = "majority_vote"
cases     = [
  { condition = ">= 2", value = 1 },  # YES
  { condition = "< 2",  value = 2 },  # NO
]
default   = 3  # INVALID if anything above failed
dependsOn = ["majority_vote"]

# ── Submit settlement ────────────────────────────────────────────────
[[tasks]]
name      = "submit_settlement"
type      = "eth_tx"
chain     = "base-sepolia"
contract  = "${ESE_ADDRESS}"
abi       = "executeSettlement(uint256,uint8)"
args      = ["${EVENT_MARKET_ID}", "map_outcome.result"]
gasLimit  = 200000
dependsOn = ["map_outcome"]
